version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: db_base
    user: "0:0"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monitoreo_base
      PGDATA: /home/postgres/pgdata/data

    ports:
      - "5433:5432"

    volumes:
      - api_base_timescaledb_data:/home/postgres/pgdata/data

    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_api_base

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5051:80"

    depends_on:
      - timescaledb

    restart: unless-stopped

volumes:
  api_base_timescaledb_data: